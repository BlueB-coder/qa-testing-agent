name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_install.ps1
      - name: Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_install.ps1
  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tagged artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --version "$RELEASE_TAG"
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256
          --verify-tag --draft --title "Portable QA Testing Agent $RELEASE_TAG"
          --notes-file CHANGELOG.md
